<body>

  <h2>CSS Classes</h2>

  <p>Regular document text not affected by style sheet.</p>

  <p class="pgray">This paragraph uses the p.gray class</p>

  <p class="pred"> This paragraph uses the p.red class</p>

  <p class="ppurple"> This paragraph uses the p.purple class</p>

  <h1>This is a h1 heading</h1>

  <h1 class="important">This is an important h1 heading</h1>

  <p>This is a normal paragraph</p>

  <p class="important">This is an important paragraph</p>

</body>
